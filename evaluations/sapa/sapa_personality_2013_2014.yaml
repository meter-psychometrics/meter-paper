# =============================================================================
# SAPA personality development evaluation — governance and analysis manifest
# =============================================================================
# Milestone 6B.3. Real-world BREADTH evaluation of the frozen model: does it
# transfer from short depression instruments to a different construct family
# under sparse missing-by-design administration?
#
# This is local research inference on a frozen model. It is NOT training,
# fine-tuning, recalibration or threshold modification.

schema_version: 6b3-sapa-manifest-v1
manifest_status: complete_pending_scale_key
dataset_id: sapa_personality_2013_2014
milestone: 6B.3
role: real_world_breadth_development_evaluation

# -----------------------------------------------------------------------------
# POLICY REVIEW — the gate, completed before any analysis
# -----------------------------------------------------------------------------
policy_review:
  policy_checked_on: 2026-08-04
  official_policy_source: >
    Harvard Dataverse dataset landing page and native API metadata for
    doi:10.7910/DVN/SD7SVE, queried 2026-08-04. The JS-rendered HTML page could
    not be read by automated fetch; the licence was taken from the Dataverse
    JSON API, which is the authoritative machine-readable record.
  explicit_ai_policy: >
    NONE. The dataset metadata contains no termsOfUse, no termsOfAccess, no
    restrictions field, and no statement about artificial intelligence, large
    language models, machine learning or automated processing. File access
    requests are disabled (fileAccessRequest: false), i.e. the files are open.
  permitted_model_activity: >
    Unrestricted by licence. CC0 1.0 waives copyright and related rights, so
    there are no licence terms that neural-model analysis could violate.
  commercial_use_status: >
    Permitted by the licence (CC0 imposes no non-commercial restriction). Not
    exercised here; this milestone is academic research only.
  external_ai_exposure_permitted: >
    Yes — no term restricts it. Contrast with HRS, whose AI/LLM Use Policy
    (updated 2026-02-04) prohibits LLM processing of HRS-distributed data; that
    prohibition is dataset-specific and does not reach this dataset.
  local_inference_permitted: true
  model_training_permitted: >
    Permitted by the licence, but PROHIBITED BY THIS PROJECT. The frozen-model
    contract forbids training or fine-tuning on any real dataset, independently
    of what a licence allows. Licence permission is not project authorisation.
  citation_required: >
    Not a licence condition under CC0, but required by scholarly norm and by
    this project. Recorded verbatim under `source.required_citation`.
  decision: PROCEED
  decision_rationale: >
    CC0 with no dataset-specific terms and no AI clause. No stop condition on
    licence or AI-use position is triggered.
  reviewer: null      # REQUIRED — project owner countersignature

