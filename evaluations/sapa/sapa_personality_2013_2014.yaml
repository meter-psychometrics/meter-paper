# -----------------------------------------------------------------------------
# ESTABLISHED CODING — from the delivered data and published metadata
# -----------------------------------------------------------------------------
coding:
  established_on: 2026-08-04
  n_respondents: 23679
  n_item_columns: 696
  n_non_item_columns: 23
  valid_response_categories: [1, 2, 3, 4, 5, 6]
  response_scale: six-point
  missing_token: "NA"
  missing_token_note: >
    The literal string "NA", not an empty cell. A naive null check would count
    every by-design blank as observed, so the token is declared explicitly.
  missingness_mechanism: planned_missing_by_design
  missingness_note: >
    Each respondent is administered a random subset of the item pool. A blank
    is NOT a respondent omission. It must be carried as missing, never imputed
    and never converted into a response category.
  observed_cell_fraction: 0.123770
  items_per_respondent: {median: 71, min: 0, max: 311}
  respondents_per_item: {median: 2554, min: 2304, max: 6096}
  pairwise_overlap: {median: 519, q05: 394, q95: 762, fraction_below_100: 0.0}
  pairwise_overlap_note: >
    Every item pair is co-administered by roughly 400-760 respondents and NO
    pair falls below 100. Two-construct tasks are therefore estimable; this was
    the main feasibility risk of a planned-missingness design and it is cleared.

published_item_metadata:
  source_file: ItemInfo696.csv
  content: >
    Per item, the construct assignment within each of eight published
    inventories, as hierarchical codes (for example "H:A:G" = HEXACO /
    Agreeableness / Gentleness). NULL where the item is not part of that
    inventory. This is the prespecification source for task definition.
  items_with_assignment:
    EPQr: 79
    HEXACO: 240
    IPIP100: 100
    IPIPneo: 300
    MPQ: 127
    PS: 40
    QB6: 48
  polarity_available: false
  polarity_note: >
    Construct assignment is present; SIGN is not. Polarity lives in
    superKey696.csv, which was not delivered.

# -----------------------------------------------------------------------------
# COVERAGE RULES — frozen from design-only summaries, before any inference
# -----------------------------------------------------------------------------
coverage_rules:
  frozen_on: 2026-08-04
  frozen_before_model_inference: true
  basis: >
    Set from the administration-design summaries above and from nothing else.
    No agreement metric had been computed when these were fixed.
  min_observed_items_per_respondent_unidimensional: 4
  min_observed_items_per_respondent_two_dimensional: 6
  min_respondents_per_item: 300
  min_pairwise_overlap: 200
  excluded_respondents: >
    Respondents with fewer observed items than the task minimum are excluded
    FROM THAT TASK and the count is reported. Respondents with zero observed
    items (min observed = 0) are excluded from every task.
  rationale: >
    Four items is the floor at which a one-dimensional latent estimate carries
    more than its prior; six is the floor for a two-slot task, where each slot
    needs multiple indicators. 300 respondents per item and 200 pairwise
    overlap sit far below the observed minima (2,304 and ~394), so they exclude
    nothing here — they are declared so a future SAPA release with thinner
    coverage is refused rather than silently analysed.

